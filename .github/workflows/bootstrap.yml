name: Bootstrap — Set Worker secrets

on:
  workflow_dispatch:
    inputs:
      stripe_webhook_secret:
        description: 'STRIPE_WEBHOOK_SECRET'
        required: true
        type: string
      download_token_secret:
        description: 'DOWNLOAD_TOKEN_SECRET'
        required: true
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Mask inputs so values never appear in logs
      - name: Mask inputs
        run: |
          echo "::add-mask::${{ inputs.stripe_webhook_secret }}"
          echo "::add-mask::${{ inputs.download_token_secret }}"

      # Product files are paid content and are not stored in this public repo.
      # Upload them from your own computer with scripts/upload-products.sh.

      # Set Worker secrets (values masked above so they don't appear in logs)
      - name: Set STRIPE_WEBHOOK_SECRET
        run: printf '%s' "${{ inputs.stripe_webhook_secret }}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --name buzzyfly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set DOWNLOAD_TOKEN_SECRET
        run: printf '%s' "${{ inputs.download_token_secret }}" | npx wrangler secret put DOWNLOAD_TOKEN_SECRET --name buzzyfly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Done
        run: echo "Bootstrap complete — secrets set."
