name: Bootstrap — Upload products & set secrets

on:
  workflow_dispatch:
    inputs:
      stripe_webhook_secret:
        description: 'STRIPE_WEBHOOK_SECRET'
        required: true
        type: string
      download_token_secret:
        description: 'DOWNLOAD_TOKEN_SECRET'
        required: true
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Mask inputs so values never appear in logs
      - name: Mask inputs
        run: |
          echo "::add-mask::${{ inputs.stripe_webhook_secret }}"
          echo "::add-mask::${{ inputs.download_token_secret }}"

      # Build buzzyfly-digital-system.zip from component products
      - name: Create buzzyfly-digital-system zip
        run: |
          cd product-files
          zip buzzyfly-digital-system.zip \
            weekly-reset-checklist.zip \
            client-onboarding-kit.zip \
            follow-up-email-templates.zip
          cd ..

      # Upload all product ZIPs to R2
      - name: Upload product files to R2
        run: |
          for product in \
            weekly-reset-checklist \
            follow-up-email-templates \
            client-onboarding-kit \
            complete-business-bundle \
            buzzyfly-digital-system; do
            npx wrangler r2 object put \
              "buzzyfly-products/products/${product}.zip" \
              --file "product-files/${product}.zip" \
              --content-type "application/zip"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Set Worker secrets (values masked above so they don't appear in logs)
      - name: Set STRIPE_WEBHOOK_SECRET
        run: printf '%s' "${{ inputs.stripe_webhook_secret }}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --name buzzyfly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set DOWNLOAD_TOKEN_SECRET
        run: printf '%s' "${{ inputs.download_token_secret }}" | npx wrangler secret put DOWNLOAD_TOKEN_SECRET --name buzzyfly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Done
        run: echo "Bootstrap complete — products uploaded, secrets set."
