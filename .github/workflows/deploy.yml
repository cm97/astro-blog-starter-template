name: Deploy

# Auto-deploy on push to main is ON again (owner request, 2026-10-21).
# The weekly improvement task merges to main, so merges go live on their own.
# Manual runs still work from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_SECRET || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.WRANGLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a5780ae59a275c38ad62c2f9a3636c75' }}
      # Load the live site after every deploy and fail the run if a key page is
      # down or a payment setting is half-configured. GitHub's runners can reach
      # the site, so this check works without anyone opening a browser.
      - name: Check the live site
        run: |
          sleep 15
          python3 - <<'PY'
          import json, sys, urllib.error, urllib.parse, urllib.request
          base = "https://www.buzzyfly.com"
          def get(path):
              req = urllib.request.Request(base + path, headers={"User-Agent": "buzzyfly-deploy-check"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode("utf-8", "replace")
          failed = []
          for path in ["/", "/store", "/jobs", "/apps-pro", "/buzzy-lands", "/blog"]:
              try:
                  code, _ = get(path)
              except Exception as e:
                  code = getattr(e, "code", str(e))
              print(f"{path}: {code}")
              if code != 200:
                  failed.append(f"{path} returned {code}")
          code, body = get("/api/health")
          health = json.loads(body)
          print("settings:", json.dumps(health))
          if health.get("paypal") and not health.get("downloadTokenSecret"):
              failed.append("PayPal keys are set but DOWNLOAD_TOKEN_SECRET is missing: buyers would pay and get no access code")
          _, apps = get("/apps-pro")
          shows_paypal = "Pay with PayPal" in apps
          print("apps-pro shows PayPal button:", shows_paypal)
          if health.get("paypal") and not shows_paypal:
              failed.append("PayPal is configured but /apps-pro does not show the PayPal button")
          _, store = get("/store")
          store_paypal = 'href="/buy/buzzyfly-digital-system"' in store
          print("store shows $49 PayPal button:", store_paypal)
          if health.get("paypal"):
              if not store_paypal:
                  failed.append("/store does not show the $49 PayPal button")
              # Start a real $49 PayPal order (unpaid, it expires on its own) and check PayPal's checkout opens.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *a, **k):
                      return None
              opener = urllib.request.build_opener(NoRedirect)
              req = urllib.request.Request(base + "/buy/buzzyfly-digital-system", headers={"User-Agent": "buzzyfly-deploy-check"})
              try:
                  r = opener.open(req, timeout=30)
                  code, loc = r.status, r.headers.get("location", "")
              except urllib.error.HTTPError as e:
                  code, loc = e.code, e.headers.get("location", "")
              host = urllib.parse.urlparse(loc).hostname or ""
              print(f"$49 PayPal checkout: {code} -> {host}{urllib.parse.urlparse(loc).path}")
              if code != 302 or not (host == "paypal.com" or host.endswith(".paypal.com")):
                  failed.append(f"$49 PayPal checkout did not open PayPal (status {code}, went to {host or 'nowhere'})")
          if not health.get("paypal"):
              print("::warning::PayPal keys not found (PayPal names on the Worker: " + (", ".join(health.get("paypalNamesFound") or []) or "none") + "); /apps-pro shows the request form")
          if failed:
              for f in failed:
                  print(f"::error::{f}")
              sys.exit(1)
          PY
      # Tell Bing, Yandex and the other IndexNow engines about every page in the
      # sitemap, so new posts get crawled in hours instead of weeks. The key
      # file lives in public/. A failure here never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          sleep 20
          python3 - <<'PY'
          import glob, json, re, urllib.request
          key = "88a79584a8a0308749374296996d6c94"
          urls = sorted({u for f in glob.glob("dist/sitemap-*.xml") for u in re.findall(r"<loc>([^<]+)</loc>", open(f).read()) if not u.endswith(".xml")})
          body = json.dumps({"host": "buzzyfly.com", "key": key, "keyLocation": f"https://buzzyfly.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f"IndexNow: {r.status} for {len(urls)} URLs")
          PY
