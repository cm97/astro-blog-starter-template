name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Accept the key under the names people commonly save it as.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || secrets.CLOUDFLARE_API_KEY || secrets.WRANGLER_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a5780ae59a275c38ad62c2f9a3636c75' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check the Cloudflare key is saved
        run: |
          found=""
          for name in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CF_TOKEN CLOUDFLARE_API_KEY WRANGLER_API_TOKEN; do
            var="S_$name"
            [ -n "${!var}" ] && found="$found $name"
          done
          echo "Repository secrets with a value:${found:- none}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No Cloudflare key is saved in this repository's Actions secrets, so nothing can be published. Create a Cloudflare API token (Edit Cloudflare Workers template, plus Zone Settings: Edit, Zone WAF: Edit and Bot Management: Edit on buzzyfly.com) and save it at Settings > Secrets and variables > Actions > Repository secrets as CLOUDFLARE_API_TOKEN. Then re-run this workflow."
            exit 1
          fi
        env:
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          S_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          S_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          S_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          S_WRANGLER_API_TOKEN: ${{ secrets.WRANGLER_API_TOKEN }}
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.json
      # Runs even when the deploy fails (a challenge page blocks Stripe either way),
      # but only when there is a key to run it with.
      - name: Keep Cloudflare from challenging visitors and Stripe
        if: ${{ !cancelled() && env.CLOUDFLARE_API_TOKEN != '' }}
        run: scripts/cloudflare-guard.sh
      - name: Check the live site the way Stripe sees it
        run: scripts/verify-live.sh
