name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check the Cloudflare key is saved
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is empty, so nothing can be published. Create a Cloudflare API token (Edit Cloudflare Workers template, plus Zone Settings: Edit, Zone WAF: Edit and Bot Management: Edit on buzzyfly.com) and save it at Settings > Secrets and variables > Actions as CLOUDFLARE_API_TOKEN. Then re-run this workflow."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a5780ae59a275c38ad62c2f9a3636c75' }}
      # Runs even when the deploy fails: a challenge page blocks Stripe either way.
      - name: Keep Cloudflare from challenging visitors and Stripe
        if: ${{ !cancelled() }}
        run: scripts/cloudflare-guard.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check the live site the way Stripe sees it
        run: scripts/verify-live.sh