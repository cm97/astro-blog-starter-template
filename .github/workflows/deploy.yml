name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time. A newer push waits for the current deploy
# to finish instead of killing it halfway through an upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://buzzyfly.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Same check CI runs on PRs: catches a bad wrangler.json or binding
      # before we touch production. Needs no Cloudflare credentials.
      - name: Wrangler dry run
        run: npx wrangler deploy --config wrangler.json --dry-run

      # Keep the built site for 14 days so a failed deploy still leaves
      # something to download and inspect from the run's Artifacts section.
      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            msg="The CLOUDFLARE_API_TOKEN repository secret is missing or empty. Create a token in Cloudflare (My Profile > API Tokens > 'Edit Cloudflare Workers' template), then add it in GitHub under Settings > Secrets and variables > Actions as CLOUDFLARE_API_TOKEN, and re-run this workflow."
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::$msg"
            {
              echo "## ❌ Deploy blocked: Cloudflare token missing"
              echo
              echo "$msg"
              echo
              echo "The site built fine. The build is saved under **Artifacts** on this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a5780ae59a275c38ad62c2f9a3636c75' }}

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "## ✅ Deployed to Cloudflare Workers"
            echo
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Live site: https://buzzyfly.com"
          } >> "$GITHUB_STEP_SUMMARY"
