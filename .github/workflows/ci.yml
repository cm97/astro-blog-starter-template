name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Email tests
        run: npm run test:email
      # Validates wrangler.json and bindings against the built worker.
      # Needs no Cloudflare credentials, so it runs on fork PRs too.
      # No --config: the build writes .wrangler/deploy/config.json, which
      # redirects wrangler to the generated dist/server/wrangler.json.
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
