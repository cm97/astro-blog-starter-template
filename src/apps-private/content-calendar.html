<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Calendar | Buzzyfly</title>
<meta name="description" content="Plan posts across platforms on a monthly calendar. Track status from idea to published. Everything stays in your browser.">
<style>
:root{--bg:#faf7ef;--card:#fff;--ink:#23201a;--muted:#6b6455;--line:#e2dccb;--accent:#e0a012;--accent-ink:#1d1606;--danger:#b3402f;--idea:#8a8270;--draft:#3b6ea5;--sched:#7a4fa0;--pub:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top,.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{padding-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top a{color:var(--muted);text-decoration:none;font-size:.95rem}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:6px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.day:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:1.5rem;margin:14px 0 4px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}
.head h2{margin:0;font-size:1.25rem;min-width:170px;text-align:center}
.nav{display:flex;align-items:center;gap:8px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{font-size:.8rem;color:var(--muted);text-align:center;padding:4px 0}
.day{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:96px;padding:5px;cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:inherit;display:block;width:100%}
.day.out{background:transparent;border-style:dashed;cursor:default;opacity:.5}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .n{font-size:.8rem;color:var(--muted)}
.chip{display:block;font-size:.72rem;line-height:1.25;padding:2px 5px;border-radius:3px;margin-top:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-idea{background:var(--idea)}.s-draft{background:var(--draft)}.s-scheduled{background:var(--sched)}.s-published{background:var(--pub)}
@media(max-width:640px){.day{min-height:62px;padding:3px}.chip{font-size:0;height:6px;padding:0;margin-top:2px}.chip::after{content:''}}
dialog{border:1px solid var(--line);border-radius:8px;padding:20px;max-width:440px;width:calc(100% - 28px);color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 8px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px}
textarea{min-height:70px;resize:vertical}
.post{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.post b{display:block}
.post small{color:var(--muted)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.help{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.foot{padding:20px 16px 40px;color:var(--muted);font-size:.9rem;max-width:1040px;margin:0 auto}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="top">
  <a href="/apps/">&larr; All apps</a>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button id="exp" type="button">Export CSV</button>
    <button id="today" type="button">Today</button>
  </div>
</div>
<div class="wrap">
  <h1>Content Calendar</h1>
  <p class="help">Tap a day to add or edit posts. Data stays on this device.</p>
  <div class="head">
    <div class="nav">
      <button id="prev" type="button" aria-label="Previous month">&larr;</button>
      <h2 id="title" aria-live="polite"></h2>
      <button id="next" type="button" aria-label="Next month">&rarr;</button>
    </div>
    <select id="filter" aria-label="Filter by platform" style="width:auto"></select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="dow" id="dow"></div>
  <div class="cal" id="cal"></div>
</div>

<dialog id="dlg">
  <h3 id="dtitle"></h3>
  <div id="dlist"></div>
  <form method="dialog" id="form" style="margin-top:6px">
    <label for="ptitle">Post idea or caption</label>
    <textarea id="ptitle" required></textarea>
    <label for="pplat">Platform</label>
    <select id="pplat"></select>
    <label for="pstat">Status</label>
    <select id="pstat">
      <option value="idea">Idea</option>
      <option value="draft">Drafting</option>
      <option value="scheduled">Scheduled</option>
      <option value="published">Published</option>
    </select>
    <div class="row">
      <button type="button" id="close">Close</button>
      <button type="button" id="cancelEdit" hidden>Cancel edit</button>
      <button type="submit" id="submit" class="primary">Add post</button>
    </div>
  </form>
</dialog>

<div class="foot">Need ready-made post ideas and prompts to fill this? Browse the <a href="/store">content toolkits</a>.</div>

<script>
(function(){
  var KEY='bf_content_calendar';
  var PLATFORMS=['Instagram','TikTok','YouTube','X','Facebook','LinkedIn','Pinterest','Blog','Newsletter'];
  var STATUS={idea:'Idea',draft:'Drafting',scheduled:'Scheduled',published:'Published'};
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var $=function(id){return document.getElementById(id)};

  function load(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):[]}catch(e){return []}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(posts))}catch(e){}}
  function pad(n){return String(n).padStart(2,'0')}
  function iso(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}

  var posts=load();
  var now=new Date(), view={y:now.getFullYear(),m:now.getMonth()};
  var selected=null, editing=null;

  DOW.forEach(function(d){var e=document.createElement('div');e.textContent=d;$('dow').appendChild(e)});
  var f=$('filter');
  [['all','All platforms']].concat(PLATFORMS.map(function(p){return [p,p]})).forEach(function(o){
    var op=document.createElement('option');op.value=o[0];op.textContent=o[1];f.appendChild(op)});
  PLATFORMS.forEach(function(p){var op=document.createElement('option');op.value=p;op.textContent=p;$('pplat').appendChild(op)});

  function visible(){
    var pf=f.value;
    return posts.filter(function(p){return pf==='all'||p.platform===pf});
  }

  function render(){
    $('title').textContent=MONTHS[view.m]+' '+view.y;
    var cal=$('cal');cal.innerHTML='';
    var first=new Date(view.y,view.m,1).getDay();
    var days=new Date(view.y,view.m+1,0).getDate();
    var vis=visible();
    var todayIso=iso(now.getFullYear(),now.getMonth(),now.getDate());
    for(var i=0;i<first;i++){var o=document.createElement('div');o.className='day out';cal.appendChild(o)}
    var counts={idea:0,draft:0,scheduled:0,published:0};
    for(var d=1;d<=days;d++){
      var key=iso(view.y,view.m,d);
      var b=document.createElement('button');
      b.type='button';b.className='day'+(key===todayIso?' today':'');
      b.setAttribute('data-date',key);
      var dayPosts=vis.filter(function(p){return p.date===key});
      b.setAttribute('aria-label',MONTHS[view.m]+' '+d+', '+dayPosts.length+' posts');
      var n=document.createElement('span');n.className='n';n.textContent=d;b.appendChild(n);
      dayPosts.forEach(function(p){
        counts[p.status]++;
        var c=document.createElement('span');c.className='chip s-'+p.status;
        c.textContent=p.platform+': '+p.title;b.appendChild(c);
      });
      cal.appendChild(b);
    }
    var s=$('stats');s.innerHTML='';
    Object.keys(STATUS).forEach(function(k){
      var sp=document.createElement('span');
      var dot=document.createElement('span');dot.className='dot s-'+k;
      sp.appendChild(dot);sp.appendChild(document.createTextNode(STATUS[k]+': '+counts[k]));
      s.appendChild(sp);
    });
  }

  function openDay(date){
    selected=date;editing=null;
    var parts=date.split('-');
    $('dtitle').textContent=MONTHS[parseInt(parts[1],10)-1]+' '+parseInt(parts[2],10)+', '+parts[0];
    resetForm();renderList();
    $('dlg').showModal();
    $('ptitle').focus();
  }

  function resetForm(){
    editing=null;$('ptitle').value='';$('pstat').value='idea';
    $('submit').textContent='Add post';$('cancelEdit').hidden=true;
  }

  function renderList(){
    var l=$('dlist');l.innerHTML='';
    var day=posts.filter(function(p){return p.date===selected});
    if(!day.length){var e=document.createElement('p');e.className='help';e.textContent='Nothing planned. Add the first post below.';l.appendChild(e)}
    day.forEach(function(p){
      var box=document.createElement('div');box.className='post';
      var t=document.createElement('div');
      var b=document.createElement('b');b.textContent=p.title;
      var sm=document.createElement('small');sm.textContent=p.platform+' \u2022 '+STATUS[p.status];
      t.appendChild(b);t.appendChild(sm);
      var act=document.createElement('div');act.style.display='flex';act.style.gap='6px';
      var ed=document.createElement('button');ed.type='button';ed.textContent='Edit';
      ed.addEventListener('click',function(){
        editing=p.id;$('ptitle').value=p.title;$('pplat').value=p.platform;$('pstat').value=p.status;
        $('submit').textContent='Save changes';$('cancelEdit').hidden=false;$('ptitle').focus();
      });
      var del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Delete';
      del.addEventListener('click',function(){
        posts=posts.filter(function(x){return x.id!==p.id});save();resetForm();renderList();render();
      });
      act.appendChild(ed);act.appendChild(del);box.appendChild(t);box.appendChild(act);l.appendChild(box);
    });
  }

  $('cal').addEventListener('click',function(e){
    var b=e.target.closest('.day');
    if(b&&b.getAttribute('data-date'))openDay(b.getAttribute('data-date'));
  });
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var title=$('ptitle').value.trim();
    if(!title)return;
    if(editing){
      posts.forEach(function(p){if(p.id===editing){p.title=title;p.platform=$('pplat').value;p.status=$('pstat').value}});
    }else{
      posts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:selected,title:title,platform:$('pplat').value,status:$('pstat').value});
    }
    save();resetForm();renderList();render();$('ptitle').focus();
  });
  $('cancelEdit').addEventListener('click',function(){resetForm()});
  $('close').addEventListener('click',function(){$('dlg').close()});
  $('prev').addEventListener('click',function(){view.m--;if(view.m<0){view.m=11;view.y--}render()});
  $('next').addEventListener('click',function(){view.m++;if(view.m>11){view.m=0;view.y++}render()});
  $('today').addEventListener('click',function(){view={y:now.getFullYear(),m:now.getMonth()};render()});
  f.addEventListener('change',render);
  $('exp').addEventListener('click',function(){
    function q(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
    var rows=[['Date','Platform','Status','Post']].concat(posts.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(p){return [p.date,p.platform,STATUS[p.status],p.title]}));
    var csv=rows.map(function(r){return r.map(q).join(',')}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='content-calendar.csv';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  });
  render();
})();
</script>
</body>
</html>
