<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Follow-Up Tracker | Buzzyfly</title>
<meta name="description" content="Track every lead with a next follow-up date so none go cold. Runs in your browser.">
<style>
:root{--bg:#faf7ef;--card:#fff;--ink:#23201a;--muted:#6b6455;--line:#e2dccb;--accent:#e0a012;--accent-ink:#1d1606;--danger:#b3402f;--ok:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{max-width:980px;margin:0 auto;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top a{color:var(--muted);text-decoration:none;font-size:.95rem}
.sheet{max-width:980px;margin:14px auto 40px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
h1{margin:0 0 4px;font-size:1.6rem}h2{font-size:1.1rem;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink);padding:6px 4px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fffdf7}
.stat b{display:block;font-size:1.35rem}.stat span{font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.78rem;border:1px solid var(--line)}
.bad{color:var(--danger);font-weight:600}.good{color:var(--ok);font-weight:600}
.rm{border:none;background:none;color:var(--danger);font-size:1.2rem;padding:4px 8px}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:.85rem}
@media print{.top,.bar,.noprint{display:none}.sheet{border:none}}
</style>
</head>
<body>
<div class="top"><a href="/apps-pro">&larr; All Buzzyfly apps</a><span class="note">Your data stays in this browser.</span></div>
<main class="sheet">

<h1>Lead Follow-Up Tracker</h1>
<p class="sub">Never lose a lead to silence. Every lead gets a next follow-up date; overdue ones rise to the top.</p>
<div class="stats" id="stats"></div>
<div class="row">
  <div><label for="n">Name</label><input id="n"></div>
  <div><label for="c">Company</label><input id="c"></div>
  <div><label for="e">Email or phone</label><input id="e"></div>
  <div><label for="v">Deal value ($)</label><input id="v" type="number" min="0" step="1"></div>
  <div><label for="s">Stage</label><select id="s"><option>New</option><option>Contacted</option><option>Proposal</option><option>Won</option><option>Lost</option></select></div>
  <div><label for="d">Next follow-up</label><input id="d" type="date"></div>
</div>
<label for="t">Notes</label><input id="t" placeholder="What was said, what they need">
<div class="bar"><button class="primary" id="add">Add lead</button><button id="csv">Export CSV</button>
<select id="f" aria-label="Filter by stage" style="width:auto"><option value="open">Open leads</option><option value="all">All</option><option>New</option><option>Contacted</option><option>Proposal</option><option>Won</option><option>Lost</option></select></div>
<div class="scroll"><table><thead><tr><th>Lead</th><th>Stage</th><th class="num">Value</th><th>Follow-up</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>

</main>
<script>

const KEY='bf_leads_v1',$=id=>document.getElementById(id);
let L=[];try{L=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){L=[]}
const save=()=>localStorage.setItem(KEY,JSON.stringify(L));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const money=n=>'$'+(n||0).toLocaleString();
const STAGES=['New','Contacted','Proposal','Won','Lost'];
$('d').value=iso(new Date(today().getTime()+3*864e5));
function days(l){const d=parse(l.d);return d?Math.round((d-today())/864e5):9999}
function render(){
  const open=L.filter(l=>l.s!=='Won'&&l.s!=='Lost'),over=open.filter(l=>days(l)<0);
  $('stats').innerHTML=`<div class="stat"><b>${open.length}</b><span>Open leads</span></div>
   <div class="stat"><b>${money(open.reduce((s,l)=>s+l.v,0))}</b><span>Open pipeline</span></div>
   <div class="stat"><b class="${over.length?'bad':''}">${over.length}</b><span>Overdue follow-ups</span></div>
   <div class="stat"><b class="good">${money(L.filter(l=>l.s==='Won').reduce((s,l)=>s+l.v,0))}</b><span>Won</span></div>`;
  const f=$('f').value;
  const list=L.map((l,i)=>({l,i})).filter(({l})=>f==='all'||(f==='open'?(l.s!=='Won'&&l.s!=='Lost'):l.s===f)).sort((a,b)=>days(a.l)-days(b.l));
  $('rows').innerHTML=list.map(({l,i})=>{const dd=days(l),closed=l.s==='Won'||l.s==='Lost';
    const when=!l.d?'':(closed?esc(l.d):(dd<0?`<span class="bad">${-dd}d overdue</span>`:dd===0?'<span class="bad">Today</span>':`in ${dd}d`));
    return `<tr><td><b>${esc(l.n)}</b><br><span class="note">${esc(l.c)} ${esc(l.e)}</span></td>
    <td><select data-st="${i}" aria-label="Stage">${STAGES.map(s=>`<option${s===l.s?' selected':''}>${s}</option>`).join('')}</select></td>
    <td class="num">${money(l.v)}</td><td>${when}</td><td>${esc(l.t)}</td>
    <td style="white-space:nowrap">${closed?'':`<button data-snz="${i}:3">+3d</button> <button data-snz="${i}:7">+7d</button> `}<button class="rm" data-rm="${i}" aria-label="Delete lead">&times;</button></td></tr>`}).join('')||'<tr><td colspan="6" class="note">No leads here yet.</td></tr>';
}
$('add').onclick=()=>{const n=$('n').value.trim();if(!n){$('n').focus();return}
  L.push({n,c:$('c').value.trim(),e:$('e').value.trim(),v:parseFloat($('v').value)||0,s:$('s').value,d:$('d').value,t:$('t').value.trim()});
  ['n','c','e','v','t'].forEach(k=>$(k).value='');save();render()};
$('rows').addEventListener('change',e=>{const i=e.target.dataset.st;if(i==null)return;L[+i].s=e.target.value;save();render()});
$('rows').addEventListener('click',e=>{const t=e.target;
  if(t.dataset.rm!=null){if(confirm('Delete this lead?')){L.splice(+t.dataset.rm,1);save();render()}}
  if(t.dataset.snz){const [i,n]=t.dataset.snz.split(':').map(Number);L[i].d=iso(new Date(today().getTime()+n*864e5));save();render()}});
$('f').onchange=render;
$('csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Name','Company','Contact','Value','Stage','Next follow-up','Notes'],...L.map(l=>[l.n,l.c,l.e,l.v,l.s,l.d,l.t])];
  const b=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='leads.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();

</script>
</body>
</html>
